# Render Blueprint: FactoryTwin EnergyOS on a Node web service + PostgreSQL.
# No containers: Render builds with Node and runs `next start`.
# Secrets are generated by Render (generateValue) or linked (fromDatabase); none live in this file.
databases:
  - name: factorytwin-energyos-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: [] # private network only; no access from the internet

services:
  - type: web
    name: factorytwin-energyos
    runtime: node
    plan: free
    region: singapore
    branch: release
    healthCheckPath: /api/health
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npx --yes pnpm@10.28.0 build
    # Migrations are idempotent and run before every start; the demo is seeded once.
    startCommand: node_modules/.bin/tsx scripts/db-setup.ts && node_modules/.bin/next start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: factorytwin-energyos-db
          property: connectionString
      - key: DB_POOL_MAX
        value: "5"
      - key: COOKIE_SECURE
        value: "true"
      # Public demo: demo logins are seeded and their password is shown on the sign-in page.
      # For a real plant set SEED_DEMO_USERS=false and create accounts under Factory settings.
      - key: SEED_DEMO_USERS
        value: "true"
      - key: DEMO_PASSWORD
        generateValue: true
      # For an external scheduler calling POST /api/cron/tick (keeps jobs running while the free server sleeps).
      - key: CRON_SECRET
        generateValue: true
      - key: INDIA_MARKET_FEED
        value: iex
      - key: ANALYSIS_DEBOUNCE_MS
        value: "60000"
